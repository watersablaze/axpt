<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 120" role="img" aria-labelledby="title">
<title id="title">Engraved marks: source, record, transit, assay receipt</title>
<defs>
 <pattern id="stone" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".6" fill="#344c50" opacity=".18"/><circle cx="7" cy="8" r=".35" fill="#344c50" opacity=".14"/></pattern>
 <filter id="etch" x="-10%" y="-10%" width="120%" height="120%">
  <feDropShadow dx=".8" dy="1.2" stdDeviation=".45" flood-color="#f8f7ef" flood-opacity=".9"/>
 </filter>
</defs>
<g stroke="#354d50" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#etch)">
 <!-- SOURCE / stratified mineral seam -->
 <g transform="translate(120 0)">
  <path d="M-35 39 L-31 19 -15 10 1 18 19 12 35 20 31 41 12 34 -3 41 -19 34 Z"/>
  <path d="M-34 48 L-18 44 -2 48 16 43 35 48 M-30 55 L-12 51 3 55 21 51 31 54" opacity=".76"/>
  <path d="M-12 25 l9 3 9-3" stroke-width=".8" opacity=".48"/>
 </g>
 <!-- RECORD / folded documentary form -->
 <g transform="translate(360 0)">
  <path d="M-25 8 H12 L26 23 V67 H-25 Z"/>
  <path d="M12 8 V23 H26"/>
  <path d="M-15 31 H12 M-15 39 H8 M-15 47 H-1"/>
  <circle cx="13" cy="57" r="8.5"/>
  <path d="M-15 58 H-3" opacity=".6"/>
 </g>
 <!-- TRANSIT / celestial navigation meridians -->
 <g transform="translate(600 0)">
  <circle cx="0" cy="36" r="28"/>
  <path d="M-28 36 H28 M0 8 C-15 22 -15 50 0 64 M0 8 C15 22 15 50 0 64 M0 8 V64" opacity=".82"/>
  <path d="M37 19 L50 9 65 11 M37 19 l9-1" stroke-width="1.3"/>
  <circle cx="50" cy="9" r="1.3" fill="#354d50" stroke="none"/>
 </g>
 <!-- ASSAY / flask with wider foot and quieter graduated scale -->
 <g transform="translate(840 0)">
  <path d="M-18 10 H18 M-11 10 V30 L-28 65 Q-31 73 -22 74 H22 Q31 73 28 65 L11 30 V10"/>
  <path d="M-18 53 H18 M-21 61 H21" stroke-width="1.1" opacity=".64"/>
  <circle cx="0" cy="66" r="4.2"/>
  <path d="M-7 34 h7 M-8 40 h5 M-11 46 h7" stroke-width=".8" opacity=".55"/>
 </g>
</g>
<g fill="#2e4549" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="13" letter-spacing="2.7" text-anchor="middle">
 <text x="120" y="105">SOURCE</text>
 <text x="360" y="105">RECORD</text>
 <text x="600" y="105">TRANSIT</text>
 <text x="840" y="111">ASSAY RECEIPT</text>
</g>
<path d="M9 117 H951" stroke="#718886" opacity=".17"/>
</svg>